apiVersion: apps/v1
kind: Deployment
metadata:
  name: embeddings
  namespace: kg-experiments
spec:
  template:
    spec:
      containers:
      - name: tei
        image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
