apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: kg-experiments
spec:
  template:
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        args:
        - --model
        - $(LLM_MODEL)
        - --quantization
        - awq
        - --max-model-len
        - "4096"
        - --port
        - "8000"
        resources:
          requests:
            nvidia.com/gpu: "1"
            memory: "8Gi"
          limits:
            nvidia.com/gpu: "1"
            memory: "10Gi"
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - |
              curl -sf -X POST http://localhost:8000/v1/chat/completions \
                -H "Content-Type: application/json" \
                -d "{\"model\":\"$LLM_MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}],\"max_tokens\":1}" \
                > /dev/null
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 20
          timeoutSeconds: 30
        readinessProbe:
          httpGet:
            path: /v1/models
            port: 8000
          initialDelaySeconds: 0
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 30
          failureThreshold: 5
        volumeMounts:
        - name: model-cache
          mountPath: /root/.cache/huggingface
      nodeSelector:
        node-role: gpu
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: model-cache
