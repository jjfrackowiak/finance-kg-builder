[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["kg_builder*"]

[project]
name = "kg-builder"
version = "0.1.0"
description = "Knowledge Graph Builder for Finance with Incremental Mutation Strategy"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Downstream Finance"},
]
license = "MIT"

dependencies = [
    "neo4j>=5.13",
    "neo4j-graphrag>=0.1.0",
    "pandas>=2.0",
    "pydantic>=2.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "networkx>=2.6,<3.0",
    "numpy<2.0",
    "rapidfuzz>=3.0",
    "yfinance>=0.2.0",
    "mlflow>=2.13",
    "boto3>=1.34",
]

[project.optional-dependencies]
sweep = [
    "kubernetes>=36.0.2",
    "dagshub>=0.3",
]
local = [
    "torch>=2.2.0,<2.3.0",
    "sentence-transformers>=2.2.0",
    "spacy>=3.0",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "black>=23.0",
    "ruff>=0.0.275",
    "mypy>=1.4",
]

[project.scripts]
kg-builder = "kg_builder.main:main"

[tool.uv]
# python-version is not a valid uv config, use requires-python in [project] instead

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=kg_builder --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
