name: 🚀 Terraform Deploy

on:
  push:
    branches: [dev, prod, qa]
    paths: ["infra/**.tf"]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1

jobs:
  resolve-env:
    name: 🗺️ Resolve environment
    runs-on: ubuntu-latest
    outputs:
      tf_dir: ${{ steps.env.outputs.tf_dir }}
      backend_vars: ${{ steps.env.outputs.backend_vars }}
      plan_apply_vars: ${{ steps.env.outputs.plan_apply_vars }}
    steps:
      - name: 🗺️ Map branch to environment
        id: env
        run: |
          BRANCH="${{ github.ref_name }}"
          case "$BRANCH" in
            prod) ENV=prod ;;
            qa)   ENV=qa   ;;
            *)    ENV=dev  ;;
          esac
          echo "tf_dir=infra"                                                          >> $GITHUB_OUTPUT
          echo "backend_vars=infra/configs/backend/$ENV/generated/backend.tfvars"      >> $GITHUB_OUTPUT
          echo "plan_apply_vars=infra/configs/backend/$ENV/generated/plan_apply.tfvars" >> $GITHUB_OUTPUT

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: resolve-env

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔑 Read deployment config
        id: config
        run: |
          GITHUB_ROLE=$(grep 'github_role_arn' ${{ needs.resolve-env.outputs.plan_apply_vars }} | cut -d'"' -f2)
          echo "github_role_arn=$GITHUB_ROLE" >> $GITHUB_OUTPUT

      - name: 🔐 Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.config.outputs.github_role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ⚙️ Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - name: 🗂️ Init
        run: terraform init -backend-config="${{ github.workspace }}/${{ needs.resolve-env.outputs.backend_vars }}"
        working-directory: ${{ needs.resolve-env.outputs.tf_dir }}

      - name: 📋 Plan
        run: terraform plan -no-color -out=tfplan
        working-directory: ${{ needs.resolve-env.outputs.tf_dir }}

      - name: 🚀 Apply
        run: terraform apply -auto-approve tfplan
        working-directory: ${{ needs.resolve-env.outputs.tf_dir }}
