name: 🚀 Terraform Deploy

on:
  push:
    branches: [dev, prod, qa]
    paths: ["infra/configs/dev/**"]

permissions:
  id-token: write
  contents: read

env:
  TF_WORKING_DIR: infra/configs/dev
  BACKEND_VARS: infra/configs/backend/dev/generated/backend.tfvars
  PLAN_APPLY_VARS: infra/configs/backend/dev/generated/plan_apply.tfvars
  AWS_REGION: eu-central-1

jobs:
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔑 Read deployment config
        id: config
        run: |
          GITHUB_ROLE=$(grep 'github_role_arn' ${{ env.PLAN_APPLY_VARS }} | cut -d'"' -f2)
          echo "github_role_arn=$GITHUB_ROLE" >> $GITHUB_OUTPUT

      - name: 🔐 Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.config.outputs.github_role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ⚙️ Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - name: 🗂️ Init
        run: terraform init -backend-config="${{ github.workspace }}/${{ env.BACKEND_VARS }}"
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: 📋 Plan
        run: terraform plan -no-color -out=tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: 🚀 Apply
        run: terraform apply -auto-approve tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}
