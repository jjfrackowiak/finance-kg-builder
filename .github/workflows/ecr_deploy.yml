name: 🐳 Build & Push ECR

on:
  workflow_dispatch:
  push:
    branches: [dev, prod, qa]
    paths:
      - "kg_builder_llm/**"
      # Baked into the image by the Dockerfile (prompt templates, fixed ontologies),
      # so a change here must rebuild or jobs run against a stale copy.
      - "resources/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  id-token: write
  contents: read

# Newer image build cancels older one — unlike terraform, no state lock risk
concurrency:
  group: ecr-deploy-${{ github.ref_name }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-central-1
  ECR_REPO: kg-orchestrator

jobs:
  resolve-env:
    name: 🗺️ Resolve environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan_apply_vars: ${{ steps.env.outputs.plan_apply_vars }}
    steps:
      - name: 🗺️ Map branch to environment
        id: env
        run: |
          BRANCH="${{ github.ref_name }}"
          case "$BRANCH" in
            prod) ENV=prod ;;
            qa)   ENV=qa   ;;
            *)    ENV=dev  ;;
          esac
          echo "plan_apply_vars=infra/configs/backend/$ENV/generated/plan_apply.tfvars" >> $GITHUB_OUTPUT

  build-push:
    name: 🐳 Build & Push
    runs-on: ubuntu-latest
    needs: resolve-env
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔑 Read deployment config
        id: config
        run: |
          VARS="${{ needs.resolve-env.outputs.plan_apply_vars }}"
          GITHUB_ROLE=$(grep 'github_role_arn' $VARS | cut -d'"' -f2)
          ROLE_ARN=$(grep '^role_arn' $VARS | cut -d'"' -f2)
          echo "github_role_arn=$GITHUB_ROLE" >> $GITHUB_OUTPUT
          echo "role_arn=$ROLE_ARN"           >> $GITHUB_OUTPUT

      - name: 🔐 Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.config.outputs.github_role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔐 Assume deployment role
        run: |
          CREDS=$(aws sts assume-role \
            --role-arn "${{ steps.config.outputs.role_arn }}" \
            --role-session-name ecr-build \
            --output json)
          KEY=$(echo "$CREDS"   | jq -r .Credentials.AccessKeyId)
          SECRET=$(echo "$CREDS"| jq -r .Credentials.SecretAccessKey)
          TOKEN=$(echo "$CREDS" | jq -r .Credentials.SessionToken)
          echo "::add-mask::$KEY"
          echo "::add-mask::$SECRET"
          echo "::add-mask::$TOKEN"
          echo "AWS_ACCESS_KEY_ID=$KEY"        >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$SECRET" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$TOKEN"      >> "$GITHUB_ENV"

      - name: 🔑 Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🏷️ Set image tags
        id: tags
        run: |
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          SHA="sha-${{ github.sha }}"
          echo "image_sha=${REGISTRY}/${{ env.ECR_REPO }}:${SHA}"   >> $GITHUB_OUTPUT
          echo "image_latest=${REGISTRY}/${{ env.ECR_REPO }}:latest" >> $GITHUB_OUTPUT

      - name: 🔨 Build image
        run: |
          docker build \
            -f kg_builder_llm/Dockerfile \
            -t ${{ steps.tags.outputs.image_sha }} \
            -t ${{ steps.tags.outputs.image_latest }} \
            .

      - name: 📤 Push to ECR
        run: |
          docker push ${{ steps.tags.outputs.image_sha }}
          docker push ${{ steps.tags.outputs.image_latest }}

      - name: 📋 Summary
        run: |
          echo "### 🐳 Image pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| SHA | \`${{ steps.tags.outputs.image_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| latest | \`${{ steps.tags.outputs.image_latest }}\` |" >> $GITHUB_STEP_SUMMARY

