name: 📋 Terraform Plan

on:
  pull_request:
    branches: [dev, prod, qa]
    paths: ["infra/**.tf"]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: eu-central-1

jobs:
  resolve-env:
    name: 🗺️ Resolve environment
    runs-on: ubuntu-latest
    outputs:
      tf_dir: ${{ steps.env.outputs.tf_dir }}
      backend_vars: ${{ steps.env.outputs.backend_vars }}
      plan_apply_vars: ${{ steps.env.outputs.plan_apply_vars }}
    steps:
      - name: 🗺️ Map branch to environment
        id: env
        run: |
          BRANCH="${{ github.base_ref }}"
          case "$BRANCH" in
            prod) ENV=prod ;;
            qa)   ENV=qa   ;;
            *)    ENV=dev  ;;
          esac
          echo "tf_dir=infra"                                                      >> $GITHUB_OUTPUT
          echo "backend_vars=infra/configs/backend/$ENV/generated/backend.tfvars" >> $GITHUB_OUTPUT
          echo "plan_apply_vars=infra/configs/backend/$ENV/generated/plan_apply.tfvars" >> $GITHUB_OUTPUT

  plan:
    name: 📋 Plan
    runs-on: ubuntu-latest
    needs: resolve-env

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔑 Read deployment config
        id: config
        run: |
          VARS="${{ needs.resolve-env.outputs.plan_apply_vars }}"
          GITHUB_ROLE=$(grep 'github_role_arn' $VARS | cut -d'"' -f2)
          ROLE_ARN=$(grep '^role_arn' $VARS | cut -d'"' -f2)
          echo "github_role_arn=$GITHUB_ROLE" >> $GITHUB_OUTPUT
          echo "role_arn=$ROLE_ARN"           >> $GITHUB_OUTPUT

      - name: 🔐 Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.config.outputs.github_role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ⚙️ Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - name: 🗂️ Init
        id: init
        run: terraform init -backend-config="${{ github.workspace }}/${{ needs.resolve-env.outputs.backend_vars }}"
        working-directory: ${{ needs.resolve-env.outputs.tf_dir }}
        env:
          TF_VAR_role_arn: ${{ steps.config.outputs.role_arn }}

      - name: 🎨 Format Check
        id: fmt
        run: terraform fmt -check
        working-directory: ${{ needs.resolve-env.outputs.tf_dir }}
        continue-on-error: true

      - name: ✅ Validate
        id: validate
        run: terraform validate -no-color
        working-directory: ${{ needs.resolve-env.outputs.tf_dir }}
        env:
          TF_VAR_role_arn: ${{ steps.config.outputs.role_arn }}

      - name: 📋 Plan
        id: plan
        run: terraform plan -no-color -out=tfplan 2>&1 | tee plan.txt
        working-directory: ${{ needs.resolve-env.outputs.tf_dir }}
        continue-on-error: true
        env:
          TF_VAR_role_arn: ${{ steps.config.outputs.role_arn }}

      - name: 💬 Post Plan Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ needs.resolve-env.outputs.tf_dir }}/plan.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n...(truncated)' : plan;

            const body = [
              '## 📋 Terraform Plan',
              '',
              '| Step | Result |',
              '|------|--------|',
              `| 🗂️ Init     | \`${{ steps.init.outcome }}\` |`,
              `| 🎨 Format  | \`${{ steps.fmt.outcome }}\` |`,
              `| ✅ Validate | \`${{ steps.validate.outcome }}\` |`,
              `| 📋 Plan    | \`${{ steps.plan.outcome }}\` |`,
              '',
              '<details><summary>📄 Show full plan</summary>',
              '',
              '```hcl',
              truncated,
              '```',
              '',
              '</details>',
              '',
              `> Triggered by @${{ github.actor }} on \`${{ github.head_ref }}\``,
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: 🚫 Fail if Plan Failed
        if: steps.plan.outcome == 'failure' || steps.validate.outcome == 'failure'
        run: exit 1
