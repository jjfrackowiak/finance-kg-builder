name: 🧪 Run Experiment Sweep

on:
  workflow_dispatch:
    inputs:
      configs:
        description: 'JSON array of experiment configs'
        required: true
        default: '[{"steps":1,"candidates":1,"feature_mode":"path"},{"steps":1,"candidates":1,"feature_mode":"subgraph"}]'
      n_workers:
        description: 'vLLM replicas during sweep'
        required: false
        default: '1'
      n_embedding_workers:
        description: 'Embedding replicas during sweep'
        required: false
        default: '1'
      time_window_days:
        description: 'Time window in days for each experiment'
        required: false
        default: '30'
      gpu_nodes:
        description: 'Number of GPU nodes (g5.xlarge) to provision'
        required: false
        default: '1'
      cpu_nodes:
        description: 'Number of CPU nodes (t3.xlarge) to provision for jobs (1–12)'
        required: false
        default: '1'
      neo4j_mode:
        description: 'Neo4j mode: sidecar (ephemeral per-job) or external (AuraDB from kg-secrets)'
        required: false
        default: 'sidecar'
      timeout_minutes:
        description: 'Workflow timeout in minutes (default 360 = 6h)'
        required: false
        default: '360'
      run_number:
        description: 'sweep_runs/run_NN.json chunk number this dispatch corresponds to (2-digit, e.g. "05"). Leave empty for one-off/manual dispatches -- only set when part of the MANIFEST.md-driven chain, since that is what triggers auto-dispatch of the next pending chunk on success.'
        required: false
        default: ''

permissions:
  id-token: write
  contents: write
  actions: write

env:
  AWS_REGION: eu-central-1

jobs:
  sweep:
    name: 🧪 Submit sweep to EKS
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(github.event.inputs.timeout_minutes) }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔑 Read deployment config
        id: config
        run: |
          VARS="infra/configs/backend/dev/generated/plan_apply.tfvars"
          GITHUB_ROLE=$(grep 'github_role_arn' "$VARS" | cut -d'"' -f2)
          ROLE_ARN=$(grep '^role_arn'          "$VARS" | cut -d'"' -f2)
          PREFIX=$(grep    '^prefix'           "$VARS" | cut -d'"' -f2)
          ACCOUNT_ID=$(echo "$ROLE_ARN" | cut -d: -f5)
          echo "github_role_arn=$GITHUB_ROLE" >> $GITHUB_OUTPUT
          echo "role_arn=$ROLE_ARN"           >> $GITHUB_OUTPUT
          echo "prefix=$PREFIX"               >> $GITHUB_OUTPUT
          echo "ecr_image=${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/kg-orchestrator:latest" >> $GITHUB_OUTPUT

      - name: 🔐 Authenticate via OIDC (GitHub role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.config.outputs.github_role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔐 Assume deployment role
        run: |
          # Role-chained sessions (OIDC -> github role -> this role) are
          # capped at 1h by AWS regardless of the role's MaxSessionDuration —
          # sweep.py refreshes these credentials proactively during long polls.
          CREDS=$(aws sts assume-role \
            --role-arn "${{ steps.config.outputs.role_arn }}" \
            --role-session-name sweep \
            --output json)
          AKID=$(echo "$CREDS" | jq -r .Credentials.AccessKeyId)
          SAK=$(echo "$CREDS"  | jq -r .Credentials.SecretAccessKey)
          STOK=$(echo "$CREDS" | jq -r .Credentials.SessionToken)
          # Mask before exporting — $GITHUB_ENV values are NOT auto-masked and were
          # leaking in plaintext in every later step's env dump.
          echo "::add-mask::$AKID"; echo "::add-mask::$SAK"; echo "::add-mask::$STOK"
          echo "AWS_ACCESS_KEY_ID=$AKID"     >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$SAK"  >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$STOK"     >> "$GITHUB_ENV"
          # True session creation time, so sweep.py's CredentialRefresher can
          # count from when the chained session ACTUALLY started (not from
          # whenever the Python object happens to be instantiated, which can
          # be 20+ min later after GPU node provisioning) -- otherwise the
          # 1h chained-session cap can be exceeded before the first refresh.
          echo "ROLE_ASSUMED_AT_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: ⚙️ Install kubectl
        uses: azure/setup-kubectl@v4

      - name: 🔗 Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name "${{ steps.config.outputs.prefix }}-eks" \
            --region ${{ env.AWS_REGION }}

      - name: 🔒 Read MLflow credentials from Secrets Manager
        id: mlflow
        run: |
          PREFIX="${{ steps.config.outputs.prefix }}"
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "${PREFIX}/kg-credentials" \
            --query SecretString \
            --output text)
          URI=$(echo "$SECRET"   | python3 -c "import sys,json; print(json.load(sys.stdin)['MLFLOW_TRACKING_URI'])")
          TOKEN=$(echo "$SECRET" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('MLFLOW_TRACKING_TOKEN') or d.get('MLFLOW_TRACKING_PASSWORD',''))")
          echo "::add-mask::$TOKEN"
          echo "mlflow_uri=$URI"     >> $GITHUB_OUTPUT
          echo "mlflow_token=$TOKEN" >> $GITHUB_OUTPUT

      - name: ⚡ Scale up GPU and CPU node groups
        run: |
          echo "Draining stale GPU nodes (timeout 3m)..."
          DRAIN_DEADLINE=$((SECONDS + 180))
          until [ "$(kubectl get nodes -l node-role=gpu --no-headers 2>/dev/null | wc -l)" = "0" ]; do
            [ $SECONDS -ge $DRAIN_DEADLINE ] && echo "Old GPU nodes still present; deleting them..." && \
              kubectl delete node -l node-role=gpu --ignore-not-found && break
            sleep 10
          done

          echo "Scaling GPU node group to ${{ github.event.inputs.gpu_nodes }}..."
          aws eks update-nodegroup-config \
            --cluster-name "${{ steps.config.outputs.prefix }}-eks" \
            --nodegroup-name "${{ steps.config.outputs.prefix }}-gpu" \
            --scaling-config desiredSize=${{ github.event.inputs.gpu_nodes }} \
            --region ${{ env.AWS_REGION }}

          echo "Waiting for CPU nodegroup to be ACTIVE before scaling..."
          CPU_NG="${{ steps.config.outputs.prefix }}-cpu"
          DEADLINE=$((SECONDS + 300))
          until [ "$(aws eks describe-nodegroup --cluster-name "${{ steps.config.outputs.prefix }}-eks" --nodegroup-name "$CPU_NG" --query 'nodegroup.status' --output text --region ${{ env.AWS_REGION }} 2>/dev/null)" = "ACTIVE" ]; do
            [ $SECONDS -ge $DEADLINE ] && echo "Timeout waiting for CPU nodegroup ACTIVE" && break
            sleep 15
          done
          echo "Scaling CPU node group to ${{ github.event.inputs.cpu_nodes }}..."
          aws eks update-nodegroup-config \
            --cluster-name "${{ steps.config.outputs.prefix }}-eks" \
            --nodegroup-name "$CPU_NG" \
            --scaling-config desiredSize=${{ github.event.inputs.cpu_nodes }} \
            --region ${{ env.AWS_REGION }}

          # Wait for ALL requested GPU nodes to be Ready, not just 1 -- vLLM needs
          # n_workers replicas scheduled before it can become ready, and node
          # launches can take well over 15m under capacity constraints (chunk 11,
          # 2026-08-06: nodes trickled in over 95min, causing vllm's own 1800s
          # readiness wait to expire while most nodes were still Pending).
          WANT_GPU=${{ github.event.inputs.gpu_nodes }}
          echo "Waiting for all $WANT_GPU GPU node(s) to be Ready (timeout 40m)..."
          DEADLINE=$((SECONDS + 2400))
          LAST_LOG=0
          until [ "$(kubectl get nodes -l node-role=gpu --no-headers 2>/dev/null | grep -c ' Ready ')" -ge "$WANT_GPU" ]; do
            READY_NOW="$(kubectl get nodes -l node-role=gpu --no-headers 2>/dev/null | grep -c ' Ready ')"
            if [ $((SECONDS - LAST_LOG)) -ge 60 ]; then
              echo "  $READY_NOW/$WANT_GPU GPU nodes Ready so far..."
              LAST_LOG=$SECONDS
            fi
            if [ $SECONDS -ge $DEADLINE ]; then
              if [ "$READY_NOW" -ge 1 ]; then
                echo "::warning::Only $READY_NOW/$WANT_GPU GPU nodes Ready after 40m -- proceeding anyway, vllm readiness wait may fail"
                break
              else
                echo "::error::0/$WANT_GPU GPU nodes Ready after 40m"
                exit 1
              fi
            fi
            sleep 10
          done
          echo "$(kubectl get nodes -l node-role=gpu --no-headers 2>/dev/null | grep -c ' Ready ')/$WANT_GPU GPU nodes Ready"

          echo "Waiting for ${{ github.event.inputs.cpu_nodes }} CPU nodes to be Ready (timeout 5m)..."
          DEADLINE=$((SECONDS + 300))
          until [ "$(kubectl get nodes -l node-role=cpu --no-headers 2>/dev/null | grep -c 'Ready')" -ge "${{ github.event.inputs.cpu_nodes }}" ]; do
            [ $SECONDS -ge $DEADLINE ] && echo "Warning: not all CPU nodes ready yet, continuing anyway" && break
            sleep 10
          done
          echo "CPU nodes ready"

      - name: 📦 Install dependencies
        run: pip install kubernetes

      - name: 🧪 Run sweep
        env:
          MLFLOW_TRACKING_URI:      ${{ steps.mlflow.outputs.mlflow_uri }}
          MLFLOW_TRACKING_USERNAME: jjfrackowiak
          MLFLOW_TRACKING_PASSWORD: ${{ steps.mlflow.outputs.mlflow_token }}
          KG_BUILDER_IMAGE: ${{ steps.config.outputs.ecr_image }}
        run: |
          python kg_builder_llm/scripts/sweep.py \
            --configs '${{ github.event.inputs.configs }}' \
            --n-workers ${{ github.event.inputs.n_workers }} \
            --n-embedding-workers ${{ github.event.inputs.n_embedding_workers }} \
            --neo4j-mode ${{ github.event.inputs.neo4j_mode }}

      - name: 🔐 Re-authenticate for cleanup
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.config.outputs.github_role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🧹 Scale down (always runs — failure, cancel, or success)
        if: always()
        run: |
          CREDS=$(aws sts assume-role \
            --role-arn "${{ steps.config.outputs.role_arn }}" \
            --role-session-name sweep-cleanup \
            --output json)
          export AWS_ACCESS_KEY_ID=$(echo "$CREDS"     | jq -r .Credentials.AccessKeyId)
          export AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r .Credentials.SecretAccessKey)
          export AWS_SESSION_TOKEN=$(echo "$CREDS"     | jq -r .Credentials.SessionToken)
          aws eks update-kubeconfig \
            --name "${{ steps.config.outputs.prefix }}-eks" \
            --region ${{ env.AWS_REGION }}
          kubectl scale deployment vllm embeddings --replicas=0 -n kg-experiments || true
          CLUSTER="${{ steps.config.outputs.prefix }}-eks"
          REGION="${{ env.AWS_REGION }}"

          # Real incident: a slow GPU node warmup (vLLM readiness can now take
          # up to 30-45min) meant this nodegroup's own scale-UP config-update
          # was STILL "UPDATING" when cleanup ran. The old wait_active
          # returned failure on timeout, which SHORT-CIRCUITED the scale-down
          # call entirely via `&&` -- 8 GPU nodes kept running, undetected,
          # until manually caught. Two changes: (1) wait longer (10min, up
          # from 5), and (2) ALWAYS attempt the scale-down call regardless of
          # whether we confirmed ACTIVE -- AWS harmlessly rejects it if the
          # nodegroup truly isn't ready, but if it settled just after our
          # last poll, we still want to try rather than give up.
          wait_active() {
            local ng="$1" deadline=$((SECONDS + 600))
            until [ "$(aws eks describe-nodegroup --cluster-name "$CLUSTER" --nodegroup-name "$ng" --query 'nodegroup.status' --output text --region "$REGION" 2>/dev/null)" = "ACTIVE" ]; do
              [ $SECONDS -ge $deadline ] && { echo "::warning::$ng not ACTIVE after 600s -- attempting scale-down anyway"; return 0; }
              sleep 15
            done
          }

          wait_active "${{ steps.config.outputs.prefix }}-gpu"
          aws eks update-nodegroup-config --cluster-name "$CLUSTER" --nodegroup-name "${{ steps.config.outputs.prefix }}-gpu" --scaling-config desiredSize=0 --region "$REGION" 2>&1 || echo "::warning::GPU scale-down API call failed"
          wait_active "${{ steps.config.outputs.prefix }}-cpu"
          aws eks update-nodegroup-config --cluster-name "$CLUSTER" --nodegroup-name "${{ steps.config.outputs.prefix }}-cpu" --scaling-config desiredSize=1 --region "$REGION" 2>&1 || echo "::warning::CPU scale-down API call failed"

          # Verify it actually landed. Loud (::error:: annotation, visible in
          # the run summary) but deliberately NOT `exit 1` -- this step has
          # `if: always()` and failing it would flip success() to false for
          # the later auto-dispatch step, incorrectly blocking the chain on a
          # cleanup hiccup even when the actual experiment succeeded.
          sleep 15
          GPU_DESIRED=$(aws eks describe-nodegroup --cluster-name "$CLUSTER" --nodegroup-name "${{ steps.config.outputs.prefix }}-gpu" --query 'nodegroup.scalingConfig.desiredSize' --output text --region "$REGION" 2>/dev/null)
          if [ "$GPU_DESIRED" != "0" ]; then
            echo "::error::GPU nodegroup desiredSize is '$GPU_DESIRED', not 0 after cleanup -- scale-down may not have applied. Manual check needed to avoid ongoing billing (this happened once already: 2026-08-06, chunk 11)."
          else
            echo "Confirmed: GPU nodegroup desiredSize=0"
          fi

      - name: 🔗 Auto-dispatch next pending chunk
        # Only chains when (a) the sweep step actually succeeded -- our exit-code
        # fix means a partial job failure inside sweep.py makes this false, so a
        # silent partial failure can no longer cascade into the next chunk -- and
        # (b) this run was itself part of the chain (run_number set), so one-off
        # manual/calibration dispatches never trigger auto-chaining.
        if: success() && github.event.inputs.run_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          THIS_RUN="${{ github.event.inputs.run_number }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Sync MANIFEST.md to the ACTUAL latest origin/dev first, then edit
          # on top of that -- not "edit the stale job-start checkout, then
          # rebase". A run can take 100+ min, during which anyone (including a
          # human tracking progress) may have also committed to MANIFEST.md;
          # editing-then-rebasing turns that into a real merge conflict that
          # fails outright (observed: chunk 05's own auto-dispatch step failed
          # this way). Resetting to the tip first means our edit always lands
          # on the true current state, so it applies cleanly regardless of
          # what changed underneath during the run. This runner is ephemeral
          # and holds no other uncommitted changes, so a hard reset is safe.
          git fetch origin dev
          git reset --hard origin/dev

          # Standalone script, not an embedded heredoc -- a heredoc's Python
          # body must start at column 0 (Python requires unindented top-level
          # statements), but YAML's block scalar (this `run: |`) requires
          # every line to match the surrounding indentation or it ends the
          # block early and tries to parse raw Python as YAML. Verified this
          # conflict locally (real ScannerError) before switching approach.
          NEXT=$(python3 kg_builder_llm/scripts/mark_chunk_and_find_next.py "$THIS_RUN" "$RUN_URL")

          git add sweep_runs/MANIFEST.md
          git commit -m "docs: auto-mark chunk ${THIS_RUN} complete, chain to next" || echo "nothing to commit"
          # HEAD:dev (not just 'dev') -- robust whether checkout left us on a
          # local branch or in detached HEAD. Fast-forward push since we just
          # synced to the tip above.
          git push origin HEAD:dev

          if [ -z "$NEXT" ]; then
            echo "🎉 No more pending chunks — sweep complete."
            exit 0
          fi

          echo "Dispatching next chunk: run_${NEXT}.json"
          gh workflow run sweep.yml --ref dev \
            -f configs="$(cat sweep_runs/run_${NEXT}.json)" \
            -f n_workers=8 \
            -f n_embedding_workers=6 \
            -f gpu_nodes=8 \
            -f cpu_nodes=5 \
            -f neo4j_mode=sidecar \
            -f run_number="${NEXT}"
