name: 🧪 Run Experiment Sweep

on:
  workflow_dispatch:
    inputs:
      configs:
        description: 'JSON array of experiment configs'
        required: true
        default: '[{"steps":3,"feature_mode":"path"},{"steps":3,"feature_mode":"subgraph"}]'
      n_workers:
        description: 'vLLM replicas during sweep'
        required: false
        default: '2'
      n_embedding_workers:
        description: 'Embedding replicas during sweep'
        required: false
        default: '2'
      time_window_days:
        description: 'Time window in days for each experiment'
        required: false
        default: '150'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1

jobs:
  sweep:
    name: 🧪 Submit sweep to EKS
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔑 Read deployment config
        id: config
        run: |
          VARS="infra/configs/backend/dev/generated/plan_apply.tfvars"
          GITHUB_ROLE=$(grep 'github_role_arn' $VARS | cut -d'"' -f2)
          echo "github_role_arn=$GITHUB_ROLE" >> $GITHUB_OUTPUT

      - name: 🔐 Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.config.outputs.github_role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ⚙️ Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name kg-experiments \
            --region ${{ env.AWS_REGION }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install uv && uv sync --frozen --no-dev

      - name: 🧪 Run sweep
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_TOKEN: ${{ secrets.MLFLOW_TRACKING_TOKEN }}
        run: |
          uv run python kg_builder_llm/scripts/sweep.py \
            --configs '${{ github.event.inputs.configs }}' \
            --n-workers ${{ github.event.inputs.n_workers }} \
            --n-embedding-workers ${{ github.event.inputs.n_embedding_workers }}
