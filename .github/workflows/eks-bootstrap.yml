name: 🚀 Bootstrap EKS Cluster

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1

jobs:
  bootstrap:
    name: 🚀 Bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔑 Read deployment config
        id: config
        run: |
          VARS="infra/configs/backend/${{ inputs.environment }}/generated/plan_apply.tfvars"
          GITHUB_ROLE=$(grep 'github_role_arn' "$VARS" | cut -d'"' -f2)
          ROLE_ARN=$(grep '^role_arn'          "$VARS" | cut -d'"' -f2)
          PREFIX=$(grep    '^prefix'           "$VARS" | cut -d'"' -f2)
          echo "github_role_arn=$GITHUB_ROLE" >> $GITHUB_OUTPUT
          echo "role_arn=$ROLE_ARN"           >> $GITHUB_OUTPUT
          echo "prefix=$PREFIX"               >> $GITHUB_OUTPUT

      - name: 🔐 Authenticate via OIDC (GitHub role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.config.outputs.github_role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔐 Assume deployment role
        run: |
          CREDS=$(aws sts assume-role \
            --role-arn "${{ steps.config.outputs.role_arn }}" \
            --role-session-name eks-bootstrap \
            --output json)
          echo "AWS_ACCESS_KEY_ID=$(echo "$CREDS"     | jq -r .Credentials.AccessKeyId)"     >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r .Credentials.SecretAccessKey)" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$(echo "$CREDS"     | jq -r .Credentials.SessionToken)"    >> "$GITHUB_ENV"

      - name: ⚙️ Install kubectl
        uses: azure/setup-kubectl@v4

      - name: 🔗 Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name "${{ steps.config.outputs.prefix }}-eks" \
            --region ${{ env.AWS_REGION }}

      - name: 🎮 Install NVIDIA device plugin
        run: |
          kubectl apply -f https://raw.githubusercontent.com/NVIDIA/k8s-device-plugin/v0.14.5/nvidia-device-plugin.yml

      - name: 📦 Apply k8s overlay
        run: kubectl apply -k k8s/overlays/aws

      - name: 💾 Apply EFS StorageClass
        run: |
          PREFIX="${{ steps.config.outputs.prefix }}"
          EFS_ID=$(aws efs describe-file-systems \
            --query "FileSystems[?Tags[?Key=='Name'&&Value=='${PREFIX}-model-cache']].FileSystemId | [0]" \
            --output text)
          kubectl apply -f - <<EOF
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: efs-sc
          provisioner: efs.csi.aws.com
          parameters:
            provisioningMode: efs-ap
            fileSystemId: ${EFS_ID}
            directoryPerms: "700"
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
          EOF

      - name: 🔒 Sync kg-secrets from Secrets Manager
        run: |
          PREFIX="${{ steps.config.outputs.prefix }}"
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "${PREFIX}/kg-credentials" \
            --query SecretString \
            --output text)

          for key in NEO4J_URI NEO4J_PASSWORD MLFLOW_TRACKING_URI MLFLOW_TRACKING_TOKEN HF_TOKEN; do
            echo "::add-mask::$(echo "$SECRET" | jq -r ".$key")"
          done

          NEO4J_URI="$(echo "$SECRET" | jq -r .NEO4J_URI)"
          NEO4J_USERNAME="$(echo "$NEO4J_URI" | sed 's|neo4j+s://||' | cut -d. -f1)"

          kubectl create secret generic kg-secrets \
            --namespace kg-experiments \
            --from-literal=NEO4J_URI="$NEO4J_URI" \
            --from-literal=NEO4J_USERNAME="$NEO4J_USERNAME" \
            --from-literal=NEO4J_DATABASE="$NEO4J_USERNAME" \
            --from-literal=NEO4J_PASSWORD="$(echo "$SECRET"        | jq -r .NEO4J_PASSWORD)" \
            --from-literal=MLFLOW_TRACKING_URI="$(echo "$SECRET"   | jq -r .MLFLOW_TRACKING_URI)" \
            --from-literal=MLFLOW_TRACKING_TOKEN="$(echo "$SECRET" | jq -r .MLFLOW_TRACKING_TOKEN)" \
            --from-literal=HF_TOKEN="$(echo "$SECRET"              | jq -r .HF_TOKEN)" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: 🔗 Annotate sweep-runner SA with Bedrock IAM role
        run: |
          PREFIX="${{ steps.config.outputs.prefix }}"
          KG_BUILDER_ROLE=$(aws iam get-role \
            --role-name "${PREFIX}-kg-builder" \
            --query Role.Arn --output text)
          kubectl annotate serviceaccount sweep-runner \
            --namespace kg-experiments \
            eks.amazonaws.com/role-arn="$KG_BUILDER_ROLE" \
            --overwrite
